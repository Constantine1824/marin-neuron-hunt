# Question: does the - side fire on the word right after a quantifying "a couple", and stay quiet after other quantifiers?
# Should fire: "a couple[[ X]]" with no "of", X a plain noun, across many nouns and sentence positions.
# Should not fire: the same nouns after "two", "three", "several", "many", "some", and "couple" (two people) followed by a verb.
# Fresh prompts written by us, not atlas exemplars.
type: activation-test
neuron: L6-N22403
side: "-"
hypothesis: >-
  The negative side fires on the word right after "a couple" used as a quantifier without "of" ("a couple
  hours", "a couple mistakes"). The same nouns after other quantifiers, and a verb after "couple" meaning two
  people, stay below the threshold.
should_fire:
  - "I'll be back in a couple[[ hours]] with the keys."
  - "She called a couple[[ times]] while you were out."
  - "We drove past a couple[[ farms]] on the way."
  - "He made a couple[[ mistakes]] in the report."
  - "Could you lend me a couple[[ dollars]] for the bus?"
  - "They planted a couple[[ trees]] in the yard."
  - "A couple[[ months]] later, the shop closed."
  - "I only need a couple[[ minutes]] of your time."
  - "There were a couple[[ problems]] with the plan."
  - "We saw a couple[[ deer]] near the road."
  - "I tried a couple[[ recipes]] from her book."
  - "Last year I read a couple[[ novels]] in French."
should_not_fire:
  - "I'll be back in two[[ hours]] with the keys."
  - "She called several[[ times]] while you were out."
  - "We drove past many[[ farms]] on the way."
  - "He made three[[ mistakes]] in the report."
  - "Could you lend me five[[ dollars]] for the bus?"
  - "They planted some[[ trees]] in the yard."
  - "Six[[ months]] later, the shop closed."
  - "I only need ten[[ minutes]] of your time."
  - "The young couple[[ bought]] the house next door."
  - "The couple[[ argued]] about the plan."
  - "I tried many[[ recipes]] from her book."
  - "The couple[[ met]] at the market."
threshold: atlas-q99
by: {github: narang99, method: agent, model: claude-opus-5-5}
