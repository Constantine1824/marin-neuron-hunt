type: activation-test
neuron: L36-N2531
side: "+"
hypothesis: >-
  The positive side goes past its atlas 99th percentile (pos_q99 0.84) on words in a sentence about answering
  a question just asked ("To answer this question", "Explain your answer", "This question can be answered"),
  and stays under it on the same target words when the sentence is about something else (answering the door
  or phone, "explain your problem", "this door can be opened"), six of them asked as questions ("Can this
  door be opened?"), so a side that fires on any question fails. Same target words in both groups (7
  " answer", 7 " your", 6 " be").
