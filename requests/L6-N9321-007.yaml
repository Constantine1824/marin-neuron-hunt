# Random baseline for -001: the same should-fire prompts, scored against everyday sentences with the target
# on the last word. Kept separate so these easy negatives don't pad -001's should-not-fire score.
type: activation-test
neuron: L6-N9321
side: "-"
hypothesis: "The negative side fires past q99 on the -001 should-fire prompts and stays below q99 on everyday sentences with no week or weekday word."
should_fire:
  - "The youth orchestra rehearses every[[ Saturday]] in the school hall."
  - "Our running group meets each[[ Wednesday]] at the north gate."
  - "The bakery makes fresh croissants every[[ Sunday]] morning."
  - "Grandpa phoned us every[[ week]] while he was stationed abroad."
  - "The comic strip runs every[[ week]] in the local paper."
  - "The pub hosts a quiz once a week on[[ Thursday]] nights."
  - "My aunt volunteers at the shelter every other[[ Monday]]."
  - "The newsletter goes out weekly on[[ Fridays]]."
  - "Each[[ week]], the coach picks a new captain."
  - "As students, we cooked a big dinner together every[[ Friday]]."
  - "The cleaners come every two[[ weeks]] to do the windows."
  - "The radio show is broadcast every[[ Tuesday]] at noon."
should_not_fire:
  - "She poured a glass of cold[[ water]]."
  - "The children laughed at the[[ clown]]."
  - "Please pass me the[[ salt]]."
  - "The dog chased the red[[ ball]]."
  - "He fixed the leaking kitchen[[ tap]]."
  - "The old man sat on the park[[ bench]]."
  - "We planted tulips in the front[[ garden]]."
  - "The baby fell asleep in the[[ car]]."
  - "My brother bought a new[[ bicycle]]."
