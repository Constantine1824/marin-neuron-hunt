type: contrast
neuron: L47-N26485
side: "+"
# Marin is causal: the activation at " as" cannot see the "well" or "well as" after it. So the two prompts in a
# pair differ only in the words BEFORE " as", and the target is always " as".
# High: a complete clause that repeats an earlier action for a new item ("..., and it sells coffee"), so a
# clause-final additive " as well." is the likely continuation.
# Low, pairs 1-14: " as" right after a bare noun phrase whose clause has not got its verb yet ("At the corner
# bakery, coffee as"). A clause-final "as well" is impossible there, but "as well as" (the explanation's main
# not_on case) is likely, so " well" is still a likely next token. Each low opens with a short lead-in so the
# target is never in the first few tokens of the prompt.
# Low, pairs 15-20: "might / may / just as well", the explanation's other not_on case, where " well" is the
# almost certain next token but the phrase is not additive.
# So both low sets keep " well" likely next. If the side only predicts " well", the lows fire as much as the
# highs and the test fails. The text after " as" only keeps each sentence natural.
