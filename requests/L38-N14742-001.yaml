hypothesis: >-
  The negative side goes past its atlas 99th percentile (neg_q99 0.98) on the word that leads into the answer
  right after the text asks a question ("? The answer is", "? Most people will say", "? The correct answer
  is"), and stays under it on the same words when the sentence before is a statement, not a question. The
  target words are the same in both groups (8 " answer", 6 " will", 6 " correct"). Six near misses put the
  target word inside a question ("Is this the correct address?"), so a side that fires anywhere near a
  question, rather than at the answer lead-in, fails.
