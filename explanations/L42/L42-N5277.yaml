label: "fringe-belief talk; expects conspiracy, anti-, fringe"
positive:
  status: explained
  confidence: weak
  cue_type: semantic-topic
  explanation: >-
    Fires in text that talks about people or ideas as fringe, denialist or extremist: conspiracy theories and
    theorists, 9/11 Trutherism, vaccine refusers, climate change denial, Holocaust denial, far-right and
    anti-government extremists. It often fires on the word just before the label (an opening quote before
    "negationists", "far" before "-proper extremist", "robust" before "far-right"), and the logit lens pushes
    " conspiracy", " Conspiracy", " conspir", " anti", " paranoid" and " fringe", so part of its job looks like
    expecting such a label. It is not just the word: " vaccine" is strongest on "vaccine refusers" and is absent
    from the stored firings in most medical uses. Below an activation of about 10 the firings are diffuse and
    only lean towards political opinion text.
    Experiments: steering the side at a neutral token (L42-N5277-003, results PR #169) raised " conspiracy",
    " paranoid" and " fringe" far above 100 random layer-42 neurons, so the logit-lens reading holds. Two
    activation tests were refuted. In L42-N5277-001 (results PR #153), 71% of the fringe-labelled targets
    cleared the q99 of 1.73 and 21% of the ordinary-sense controls did too. In L42-N5277-002 (results PR #169),
    " conspiracy" after a fringe adjective (crazy, paranoid, absurd, ridiculous, silly) fired 24/24 at 33-50,
    but after an ordinary one it still had a median of 6.6, with 9 of 24 above the bar of 8: "tax conspiracy"
    fired at 38-42, and "federal", "criminal" and "military conspiracy" at 9-12. The separation is strong
    (AUROC 0.96), so it does prefer the fringe sense, but the word " conspiracy" alone already lifts it
    moderately whatever the framing.
  fires_on: "'conspiracy theories/theorist', 'vaccine refusers', 'climate change denial', 'Holocaust denier', 'far-right' or 'anti-government' extremists, and the word just before such labels"
  not_on: "not established: ordinary ' conspiracy' (criminal, federal, military, smuggling) fires much less than the fringe sense, but often still around 7-12, and 'tax conspiracy' fires as strongly as the fringe sense (L42-N5277-002)"
