    The strongest firings sit just before or on "can't" / "couldn't" ("they still can't spell my name", "I
    can't find it"), and the logit lens pushes " cannot", " cant", " unable", " couldn", " inability". But only
    22% of the 283 strong firings are on or right before can't / couldn't / cannot / unable, "can" in "can't"
