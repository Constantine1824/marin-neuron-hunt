  cue_type: phrase-idiom
  explanation: >-
    A weak side (atlas extreme +0.77, q9999 0.292). It fires on the second verb of some fixed verb pairs:
    "pick and[[ choose]]" (+0.54 to +0.77), "tossing and[[ turning]]" (+0.70 to +0.76), "kicked and[[ punched]]" (+0.90),
    "pushed and[[ shoved]]" (+0.42). The same verb on its own reads about 0. Ordinary paired verbs read less
    ("sang and danced" +0.17, "washed and dried" 0.00), and fixed noun or adjective pairs don't fire ("salt and
    pepper", "back and forth", "sooner or later", "safe and sound": all within 0.15 of zero). It also fires on a
    word after "just": "just[[ perfect]]" (+0.42 to +0.66), "just[[ great]]" (+0.25 to +0.38), "Maybe, just[[ maybe]]"
    (+1.23), "Perhaps, just[[ perhaps]]" (+0.67). Without "just" the same words read about 0.
  fires_on: "'pick and choose', 'tossing and turning', 'kicked and punched', 'pushed and shoved'; 'just perfect', 'just great', 'maybe, just maybe'"
  not_on: >-
    the same verbs or adjectives without the first verb or "just"; fixed noun and adjective pairs ('salt and
    pepper', 'back and forth', 'sooner or later'). Measured on prompts we wrote, not the deep tier.
