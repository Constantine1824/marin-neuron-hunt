neuron: L6-N9321
data: pilot/fineweb-10m-sparse
label: "one dated occasion vs a repeating weekly schedule"
positive:
  status: explained
  confidence: weak
  cue_type: semantic-topic
  explanation: >-
    Fires on a week or weekday word ("week", "Monday", "Sunday", "weekend") that points to one particular
    occasion, as in "one morning last week", "on Monday, December 21", "the week before Christmas" and "the 27th
    falls on a Sunday". Several weaker firings are rates ("6 days of effort per week" +1.63), so the line between
    one occasion and a rate is not settled.
  fires_on: "'last week', 'this week' in a narrative, 'on Monday, December 21', 'the week before Christmas'"
  not_on: "the same words when they name a repeating slot ('every week', 'every Tuesday'); untested on prompts"
  evidence: [0, 2, 3, 5, 6, 8, 9, 10, 20, 21]
  verification: untested
negative:
  status: explained
  confidence: weak
  cue_type: semantic-topic
  explanation: >-
    Fires on the same week and weekday words when they name a repeating slot in a schedule, as in "tune in every
    week", "airs every Tuesday", "once a week on Sunday" and "Saturday of each week". It also fires inside
    serial content such as weekly columns, shows and recaps ("This week we take a look at", "this week's gaming
    edition"). The weaker firings spread to non-time words in those texts ("meeting", "host", "edition").
  fires_on: "'every week', 'every Tuesday', 'weekly', 'each week', and 'this week' inside a weekly column or show"
  not_on: "the same words naming one occasion ('last week', 'on Monday, December 21'); untested on prompts"
  evidence: [0, 1, 2, 5, 6, 7, 9, 12, 13, 31]
  verification: untested
relation: variant
relation_note: >-
  Both sides read the same calendar words: the positive side treats them as a single occasion, the negative side
  as a repeating slot.
by:
