neuron: L48-N20456
data: pilot/fineweb-10m-sparse
label: "doubted or unreal things; pushes 'imaginary', 'supposed'"
positive:
  status: explained
  confidence: weak
  cue_type: next-token
  explanation: >-
    Fires just before a noun phrase the writer treats as doubtful, false or unreal, mostly on the determiner or
    possessive in front of it: "an alleged link", "the supposed cancellation", "some so-called improvements",
    "this 'extreme level'", "that illusion of", "Iraq's weapons of mass destruction". Its logit lens pushes
    " imaginary", " imagined", " supposed", " fictional", " phantom", " nonexistent", " alleged" and " perceived",
    so it looks like it expects a word that casts doubt on what comes next. The stronger the firing, the more
    often scare quotes or such a word really follow; below an activation of about 10 it is diffuse.
    Experiments: a contrast with the same noun phrase framed as baseless or as real (L48-N20456-001, results PR
    #122) was confirmed, 30/30 pairs in the predicted direction, and steering the side on a neutral determiner
    (L48-N20456-003, results PR #168) raised " supposed", " alleged", " imaginary" and similar words far above
    100 random layer-48 neurons. A one-word swap was refuted (L48-N20456-002, results PR #168): putting "falsely"
    before the claim lifted the determiner only a little (mean 4.2, 10 of 24 above the q99 of 3.89, against
    1.0-2.1 for "correctly", "recently" or "angrily"). So the direction is right, but a single doubting adverb
    earlier in the sentence is not enough for strong firing; it seems to need the doubt framed around the noun
    phrase itself.
  fires_on: "determiners and possessives before a doubted or scare-quoted noun phrase ('an alleged', 'the supposed', 'their \"guidelines\"'), and the 'so' of 'so-called'"
  not_on: "determiners stay low when the claim is framed as real (L48-N20456-001), and in L48-N20456-002 'falsely', 'correctly', 'recently' and 'angrily' before the claim all left it mostly below 4"
  evidence: [0, 1, 2, 3, 4, 5, 7, 8, 10, 12, 14, 15, 16, 17, 19, 21, 25, 26, 28, 29, 30, 31]
  verification: confirmed
negative:
  status: explained
  confidence: weak
  cue_type: grammar
  explanation: >-
    Much weaker (min -18.6 against max +73.4). The strongest firings are on " made" in "made up", "made famous",
    "made known" and "made up of", and on the object or verb in "make it harder", "making them up", "became
    clear". A few are dismissive adjectives ("misguided", "unsubstantiated", "trivial"). Its logit lens pushes
    hedges (" potentially", " apparently", " possibly", " seemingly", " reportedly"), but only weakly.
  fires_on: "' made' in 'made up / made famous / made known', objects of 'make it ...', 'became'"
  not_on: "most uses of ' made' are absent from the stored firings (53 of 5,581 stored); non-firing is untested in the sparse tier"
  evidence: [0, 1, 2, 4, 7, 8, 10, 13, 14, 15, 17, 19, 20, 21, 22, 26, 28]
  verification: untested
relation: unrelated
relation_note: >-
  The positive side tracks doubt about a claim, while the negative side mostly tracks the verb "made" and
  make/become constructions; "made up" and the hedging logit lens touch the same theme, but too little to call
  them one job.
