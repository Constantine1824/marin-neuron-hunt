  cue_type: next-token
  explanation: >-
    Fires on "over" when "the years" is likely to follow, usually in a clause looking back on accumulated
    experience ("we have had some incredible artists teach here over the years", "She has served on several
    boards over her career"). 31 of the 32 top exemplars (max +87.5, 29 documents) are "over", 23 of them before
    "the"; of the 133 firings at +40 or more, 65% are on "over" and 86% have years / decades / centuries / career
    / lifetime within the next 5 tokens. Logit lens top: " years" 4.59, " over" 4.41, " Years" 4.22.
  fires_on: >-
    'over' in "over the years" (unstored counted as 0): 79% pass q999 (+8.74), 60% reach +20, median +25.7
    (n=210). Partly "over the past" (47% past q999, n=176) and "over the last" (40%, n=162). A perfect "have"
    in the previous 12 tokens is common in strong firings (54% at +40, against 14% of all "over" tokens).
  not_on: >-
    other spans: "over the next" 6% past q999 (n=108), "over the course" 19% (n=101), "over time" 11% (n=285),
    "over the weekend" 0 of 24; spatial "over the X" ("world" 0 of 118, "top" 0 of 39, "counter" 0 of 49).
    Counterexamples: some "over the years" after a change verb are not stored ("problems which have built up
    over the years"), and "inspired many players over." reaches +60.1 with no years ahead. Sparse-tier rates
    (top 64 neurons per token), so these are floors.
