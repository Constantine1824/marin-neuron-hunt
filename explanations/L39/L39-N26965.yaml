  confidence: weak
  cue_type: lexical
  explanation: >-
    About 8x weaker (max +12.2 against min -102.5). Fires on "one" when it means exactly one, a single unit, as
    opposed to "one of" or the pronoun: "with one click", "just one word", "Many rural areas had one large
    insurer", "no document -- not one --", "at one time", "into one big file", "all the information is in one
    place". 25 of the 32 top exemplars (30 documents) are "one". Two are the digit "1" ("on 1 sheet", "slots
    with 1,024"), two are in "a moment" ("haven't regretted a moment of it"), one is "every", and two are on a
    garbled "two windowseparated".
    Of the 214 firings at +5 or more (180 documents, at most 4 per document), 173 are "one" (81%); at q999 (+2.04;
    891 firings) 77% are "one" and 60 are "every". Recall is low: only 3.1% of all 21,857 "one" tokens pass q999.
    Logit lens top is " single" +4.19, "single" +3.75, " SINGLE" +3.47, " singular" +2.97 (small values), so this
    side mildly pushes "single" next, as in "one single".
  fires_on: >-
    'one' as a single unit (unstored tokens counted as 0; share past q999 / at +5 or more): after a preposition
    with a unity noun next ("in one place / go / piece", "at one time", "with one click": 38% / 17%, n=167); "in
    one go" 7 of 10 / 4 of 10; "in one place" 40% / 12% (n=42); "at one time" 27% / 12% (n=41); "one single" 47%
    / 22% (n=32); after "just / only / not / exactly" 18% / 5.1% (n=295).
  not_on: >-
    "one of" (0.6% pass q999, n=5,569; "in one of" 5%, n=146); "no / every / any / each one" (1.8%, n=841); "the
    / this one" (5.1%, n=2,620); the digit "1" (0.1%, n=16,265); "every" (1.3%, n=4,484). Counterexamples: most
    unity uses are not stored at all ("is still one bad dude", "there was one tatty building", "subsume one in
    the other"), and a few "one of" fire ("in one of the following", +7.6, rank 25). Many other neurons in layers
    10-50 have this kind of "one" pole (dozens with 32 of 32 exemplars on "one"). Read from the sparse tier,
    which keeps only each token's top 64 neurons, and this side's values are small, so these rates are floors
    and need an activation test.
