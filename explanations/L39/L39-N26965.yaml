  cue_type: lexical
  explanation: >-
    Fires on the word "single" in almost every use. It is strongest in "single-handedly" and "the single +
    superlative" ("a man who is single handedly cleaning", "he almost single-handedly shaped", "the single dumbest
    idea", "the single greatest sign", "the single most important factor"). All 32 top exemplars (min -102.5, 31
    documents) are "single". Of the 1,427 firings at -25 or below (912 documents), 93% are "single" and 98% are
    "single", "singles", "singled", "singular" or "singly"; of the 259 at -50 or below (206 documents, at most 8 per
    document), 95% and 99%. But it is not limited to emphatic "single": 98% of all 1,836 "single" tokens pass q999
    (-5.38) and 72% reach -25, including literal "a single store", "single parents", "single-player" and "I am
    single". Magnitude depends on the words before: after "the" the median is -49 and in a verbal slot ("who /
    almost / can single-handedly") -49, but after "a" it is -26, after "every / each" -30 and after "not a" -23.
    Logit lens: this side lowers " single" (top +4.19) and raises "tons", "-handed" -3.48, "-digit" -3.41,
    "-minded" -2.56, "-player" -2.41, "-family" -2.41, "-parent" -2.02, which are continuations of "single"
    compounds (small values).
  fires_on: >-
    'single' (unstored counted as 0; share past q999 -5.38 / at -25 or below / at -50 or below): all 98% / 72% /
    13.5% (n=1,836, median -32.3); "single-handed(ly)" 11 of 11 reach -25, 10 reach -50 (median -78); "the single"
