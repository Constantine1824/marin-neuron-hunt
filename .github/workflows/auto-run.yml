name: auto-run

# Station House dispatches this when an open request PR passes every auto-run rule (CONTRIBUTING.md, "Auto-run").
# It checks out main only: the PR's requests/<id>.yaml files are read as data through the GitHub API at head_sha
# (runner/autorun.py), and nothing from the PR is checked out or run. Results go to one results PR per request,
# which a maintainer merges as usual. Progress is reported back to Station House.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Request PR number"
        type: string
        required: true
      head_sha:
        description: "The PR head commit Station House checked; the run is refused if the PR has moved"
        type: string
        required: true
      auto_run_id:
        description: "Station House auto-run id (for callbacks)"
        type: string
        required: true
      cap_usd:
        description: "Cost cap per request and per PR, USD"
        type: string
        default: "10"
      dry_run:
        description: "Only check the PR and estimate (no GPU, no results PR)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-run-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RUNNER_GH_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "modal>=1.0" pyyaml jsonschema "transformers==5.10.2"
      - run: |
          git config user.name "marin-hunt-runner"
          git config user.email "marin-hunt-runner@users.noreply.github.com"
      - name: Run
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GH_TOKEN: ${{ secrets.RUNNER_GH_TOKEN || github.token }}
          AUTO_RUN_CALLBACK_TOKEN: ${{ secrets.AUTO_RUN_CALLBACK_TOKEN }}
          PLATFORM_URL: ${{ vars.PLATFORM_URL || secrets.PLATFORM_URL || 'https://app.station-house.net' }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head_sha }}
          AUTO_RUN_ID: ${{ inputs.auto_run_id }}
          CAP_USD: ${{ inputs.cap_usd || '10' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "pr must be a number"; exit 1;; esac
          case "$HEAD_SHA" in ''|*[!0-9a-f]*) echo "head_sha must be a hex commit"; exit 1;; esac
          case "$AUTO_RUN_ID" in ''|*[!A-Za-z0-9_-]*) echo "auto_run_id must be [A-Za-z0-9_-]"; exit 1;; esac
          case "$CAP_USD" in ''|*[!0-9.]*) echo "cap_usd must be a number"; exit 1;; esac
          args="--pr $PR --sha $HEAD_SHA --auto-run-id $AUTO_RUN_ID --cap-usd $CAP_USD"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; else args="$args --publish"; fi
          python -m runner.main $args
